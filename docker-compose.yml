services:
  db:
    image: postgres:16-alpine
    container_name: clinical-history-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinical_history}
      POSTGRES_USER: ${POSTGRES_USER:-clinical_history}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe configurarse en .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: clinical-history-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinical-history-app
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-clinical_history}
      DB_USERNAME: ${POSTGRES_USER:-clinical_history}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe configurarse en .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MANAGEMENT_SERVER_PORT: 8081
      GRAPHIQL_ENABLED: ${GRAPHIQL_ENABLED:-true}
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: clinical-history-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.3.0
    container_name: clinical-history-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  grafana_data:
