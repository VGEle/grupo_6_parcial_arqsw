spring.datasource.url=jdbc:h2:mem:clinical_history;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway ejecuta V1 y Hibernate valida el mapeo contra ese esquema.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.data.redis.repositories.enabled=false
management.server.port=-1
