spring.application.name=clinical-history-graphql
# Render asigna el puerto mediante la variable PORT.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinical_history}
spring.datasource.username=${DB_USERNAME:clinical_history}
spring.datasource.password=${DB_PASSWORD:change_this_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=${FLYWAY_OUT_OF_ORDER:false}

spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:true}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=5s

# Caché de consultas de historias clínicas.
clinical-history.cache.ttl-minutes=${CACHE_TTL_MINUTES:5}

management.server.port=${MANAGEMENT_SERVER_PORT:}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
